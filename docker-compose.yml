# Billing Portal production compose (Dokploy reference / local test).
# On Dokploy you can either deploy the Dockerfile from your Git repo, or use this
# compose (PostgreSQL service is also available as a native Dokploy service).
#
# Set the same environment variables in the Dokploy app/service UI.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: billing_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing_portal"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/billing_portal?schema=public
      API_URL: ${API_URL:-https://localhost}
      CLIENT_URL: ${CLIENT_URL:-https://localhost}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      PORTAL_NAME: ${PORTAL_NAME:-Billing Portal}
      PORTAL_TAGLINE: ${PORTAL_TAGLINE:-Finance & Billing}
      COMPANY_NAME: ${COMPANY_NAME:-Your Company}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-billing@example.com}
      COMPANY_WEBSITE: ${COMPANY_WEBSITE:-https://example.com}
      PAYMENT_HOST: ${PAYMENT_HOST:-localhost}
      PUBLIC_LOGO_URL: ${PUBLIC_LOGO_URL:-}
      DEFAULT_BRAND_NAME: ${DEFAULT_BRAND_NAME:-Your Company}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Portal Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      INVITE_TOKEN: ${INVITE_TOKEN:?set INVITE_TOKEN}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_APP_ID: ${SQUARE_APP_ID:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:?set SQUARE_ACCESS_TOKEN}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:?set SQUARE_LOCATION_ID}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"Billing Portal <billing@example.com>"}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: "10"
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
